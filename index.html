<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* base reset (the Claude viewer used to add this) */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Geo Zenzation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: atlas game board (top-10 list as an elevation ladder) beside a live scoreboard rail */
:root {
  --bg: #E4EBE9;
  --surface: #F7F9F8;
  --surface-2: #EDF2F0;
  --ink: #13233A;
  --muted: #56677A;
  --line: #C6D2CF;
  --accent: #1D5C88;
  --accent-ink: #FFFFFF;
  --hit: #2A7A4B;
  --tension: #C5321C;
  --miss: #6E7B88;
  --contour: rgba(29, 92, 136, 0.09);
  --p1: #0D7F84; --p2: #6A45B5; --p3: #A86E12; --p4: #2B5CA8; --p5: #B4436C; --p6: #4F7A28;
  /* hypsometric tints: rank 1 = summit, rank 10 = lowland */
  --h1: #7E4630; --h2: #95573A; --h3: #AE6C40; --h4: #C58447; --h5: #D29E4F;
  --h6: #C9B259; --h7: #A9B45C; --h8: #86AA5C; --h9: #65A05D; --h10: #4C925C;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1822; --surface: #142330; --surface-2: #1A2C3B; --ink: #E3ECF2; --muted: #93A6B5;
    --line: #2A3F51; --accent: #5BAAD8; --accent-ink: #061420; --hit: #5DCB8C; --tension: #FF6C50;
    --miss: #8B98A5; --contour: rgba(91, 170, 216, 0.07);
    --p1: #3CC4C9; --p2: #A98DF2; --p3: #EBB24C; --p4: #6F9DEB; --p5: #F07AA5; --p6: #9BCB6A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1822; --surface: #142330; --surface-2: #1A2C3B; --ink: #E3ECF2; --muted: #93A6B5;
  --line: #2A3F51; --accent: #5BAAD8; --accent-ink: #061420; --hit: #5DCB8C; --tension: #FF6C50;
  --miss: #8B98A5; --contour: rgba(91, 170, 216, 0.07);
  --p1: #3CC4C9; --p2: #A98DF2; --p3: #EBB24C; --p4: #6F9DEB; --p5: #F07AA5; --p6: #9BCB6A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: repeating-radial-gradient(circle at 92% -8%, transparent 0 26px, var(--contour) 26px 27px);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
}
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
header.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.brand { font-family: var(--display); font-weight: 900; font-size: clamp(34px, 6vw, 52px); letter-spacing: 0.02em; line-height: 0.9; margin: 0; text-transform: uppercase; }
.brand span { color: var(--tension); }
.tag { color: var(--muted); margin: 0; font-size: 14px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
@media (max-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
h2, h3 { margin: 0; }
.eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.label { font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

button { font: inherit; color: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 16px; font-weight: 600; transition: transform .08s ease, background .15s ease; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.big { padding: 13px 22px; font-size: 16px; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type="text"], textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0;
}
textarea { font-family: var(--mono); font-size: 13px; line-height: 1.55; resize: vertical; }

/* setup */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 16px; font-family: var(--mono); font-weight: 700; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .names { grid-template-columns: minmax(0, 1fr); } }
.pname { display: flex; align-items: center; gap: 10px; }
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .settings { grid-template-columns: minmax(0, 1fr); } }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.stepper .ctl { display: flex; align-items: center; gap: 8px; }
.stepper .ctl button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.stepper .num { font-family: var(--mono); font-weight: 700; font-size: 18px; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .cats { grid-template-columns: minmax(0, 1fr); } }
.cat { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
.cat:has(input:checked) { border-color: var(--accent); background: var(--surface-2); }
.cat input { margin-top: 3px; accent-color: var(--accent); }
.cat b { display: block; font-size: 14.5px; }
.cat small { color: var(--muted); font-size: 12.5px; display: block; }
.cat .del { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; padding: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.err { color: var(--tension); font-size: 13.5px; font-weight: 600; margin: 0; }

/* round head */
.round-head h2 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5vw, 44px); line-height: 1; text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance; margin-top: 6px; }
.round-head p.prompt { margin: 8px 0 0; color: var(--muted); max-width: 62ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); }
.chip.t { border-color: var(--tension); color: var(--tension); background: transparent; }

/* turn */
.turn { display: flex; flex-direction: column; gap: 12px; border-top: 4px solid var(--pc, var(--accent)); }
.who-now { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.who-now .name { font-family: var(--display); font-weight: 800; font-size: 26px; text-transform: uppercase; line-height: 1; color: var(--pc); }
.pips { display: flex; gap: 5px; margin-left: auto; align-items: center; }
.pip { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--pc); }
.pip.on { background: var(--pc); }
.pips span.txt { font-size: 12.5px; color: var(--muted); margin-right: 4px; }
form.guess { display: flex; gap: 8px; flex-wrap: wrap; }
form.guess input { flex: 1 1 200px; font-size: 17px; padding: 12px 14px; }

.flash { border-radius: 8px; padding: 10px 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; animation: flashIn .35s ease; }
.flash .pts { font-family: var(--mono); font-weight: 700; font-size: 18px; margin-left: auto; font-variant-numeric: tabular-nums; }
.flash.hit { background: color-mix(in srgb, var(--hit) 14%, transparent); color: var(--hit); }
.flash.tension { background: color-mix(in srgb, var(--tension) 14%, transparent); color: var(--tension); }
.flash.miss { background: color-mix(in srgb, var(--miss) 16%, transparent); color: var(--ink); }
.flash.info { background: var(--surface-2); color: var(--muted); }
@keyframes flashIn { from { transform: translateY(-4px); opacity: .3; } to { transform: none; opacity: 1; } }
.flash.tension { animation: shake .4s ease; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

/* board */
.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.slot {
  display: grid; grid-template-columns: 8px 46px minmax(0, 1fr) auto; align-items: center;
  min-height: 50px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
}
.slot .band { align-self: stretch; background: var(--h); }
.slot .rk { font-family: var(--display); font-weight: 900; font-size: 26px; text-align: center; color: var(--muted); }
.slot .ans { padding: 8px 6px; min-width: 0; }
.slot .ans b { font-size: 16.5px; display: block; overflow-wrap: anywhere; }
.slot .ans small { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.slot .hid { display: block; height: 10px; width: 46%; border-radius: 5px; background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 13px); }
.slot .end { padding: 0 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.slot .worth { font-family: var(--mono); font-weight: 700; }
.slot.found { border-color: color-mix(in srgb, var(--pc) 55%, var(--line)); }
.slot.found .rk { color: var(--ink); }
.slot.missed .ans b { color: var(--muted); font-weight: 600; }
.slot.pop { animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(.97); background: color-mix(in srgb, var(--pc) 22%, var(--surface)); } 100% { transform: none; } }
.pchip { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--pc); font-size: 13px; }
.pchip .dot { width: 10px; height: 10px; background: var(--pc); }
.pchip .plus { font-family: var(--mono); }

.tension-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.source { font-size: 12.5px; color: var(--muted); margin: 0; }

/* round summary */
.summary h3 { font-family: var(--display); font-size: 28px; font-weight: 800; text-transform: uppercase; line-height: 1; }
.rpts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.rpt { border-radius: 8px; padding: 10px 12px; background: var(--surface-2); border-left: 4px solid var(--pc); }
.rpt .n { font-weight: 700; font-size: 13.5px; overflow-wrap: anywhere; }
.rpt .v { font-family: var(--mono); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }

/* sidebar */
aside.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 880px) { aside.side { position: static; } }
.side h2 { font-family: var(--display); font-weight: 800; font-size: 26px; text-transform: uppercase; line-height: 1; }
.scores { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.score { display: grid; grid-template-columns: 22px 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 10px; border-radius: 8px; background: var(--surface-2); border: 2px solid transparent; }
.score.now { border-color: var(--pc); }
.score .pos { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.score .dot { background: var(--pc); width: 12px; height: 12px; }
.score .nm { font-weight: 700; overflow-wrap: anywhere; }
.score .nm small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.score .tot { font-family: var(--mono); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; text-align: right; }
.delta { font-family: var(--mono); font-size: 12px; font-weight: 700; }
.delta.up { color: var(--hit); }
.delta.down { color: var(--tension); }
.hist-wrap { overflow-x: auto; }
table.hist { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.hist th, table.hist td { padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--line); }
table.hist th:first-child, table.hist td:first-child { text-align: left; color: var(--muted); font-weight: 500; }
table.hist td { font-family: var(--mono); }
table.hist tfoot td { font-weight: 700; border-bottom: 0; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; font-size: 13px; }
.log li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.log .dot { width: 8px; height: 8px; background: var(--pc); }
.log .g { overflow-wrap: anywhere; }
.log .r { font-family: var(--mono); font-weight: 700; }
.log .r.hit { color: var(--hit); } .log .r.tension { color: var(--tension); } .log .r.miss { color: var(--muted); } .log .r.pass { color: var(--muted); font-weight: 500; }

.rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.rules li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.rules .k { font-family: var(--mono); font-weight: 700; font-size: 17px; text-align: right; }
.rules .k.hit { color: var(--hit); } .rules .k.t { color: var(--tension); } .rules .k.m { color: var(--miss); }
.ladder { display: flex; gap: 3px; margin-top: 4px; }
.ladder span { flex: 1; height: 26px; border-radius: 4px; background: var(--h); color: #fff; font-family: var(--display); font-weight: 900; font-size: 15px; display: grid; place-items: center; }

/* final */
.winner { text-align: left; }
.winner .crown { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 8vw, 72px); line-height: .9; text-transform: uppercase; color: var(--pc); overflow-wrap: anywhere; }
.podium { display: flex; flex-direction: column; gap: 6px; }
.podium .score { background: var(--surface-2); }


/* secret entry + reveal */
.cover { border-top: 4px solid var(--pc); }
.cover-name { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 8vw, 64px); line-height: .95; text-transform: uppercase; color: var(--pc); overflow-wrap: anywhere; }
.entry-list { display: flex; flex-direction: column; gap: 8px; }
.entry-row { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; }
.entry-row .num { font-family: var(--display); font-weight: 900; font-size: 22px; color: var(--pc); text-align: center; }
.entry-row input { font-size: 17px; padding: 12px 14px; }
.ladder.big span { height: auto; padding: 6px 0; display: flex; flex-direction: column; gap: 1px; }
.ladder.scored .step { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ladder.scored i { width: 100%; height: 26px; border-radius: 4px; background: var(--h); color: #fff; font-style: normal; font-family: var(--display); font-weight: 900; font-size: 15px; display: grid; place-items: center; }
.ladder.scored em { font-style: normal; font-family: var(--mono); font-weight: 700; font-size: 11.5px; line-height: 1.1; text-align: center; font-variant-numeric: tabular-nums; }
.ladder.scored em.neg { color: var(--tension); }
.ladder.scored em.pos { color: var(--hit); }
.ladder.scored em b { display: block; color: var(--tension); font-size: 12px; }
.ladder.big b { font-size: 15px; }
.ladder.big em { font-style: normal; font-family: var(--mono); font-size: 12px; font-weight: 700; }
@media (max-width: 520px) { .ladder.big { flex-wrap: wrap; } .ladder.big span { flex: 1 0 18%; } }
.answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.acard { background: var(--surface-2); border-radius: 8px; border-top: 4px solid var(--pc); padding: 10px 12px; min-width: 0; }
.acard-h { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; color: var(--pc); margin-bottom: 6px; }
.acard-h .v { font-family: var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.acard ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.acard li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; }
.acard .g { overflow-wrap: anywhere; font-weight: 600; }
.acard .g small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.res { font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.res.pending { color: var(--muted); border: 1px dashed var(--line); }
.res.hit { background: color-mix(in srgb, var(--hit) 16%, transparent); color: var(--hit); }
.res.safe, .res.ext, .res.none { background: color-mix(in srgb, var(--miss) 16%, transparent); color: var(--ink); }
.res.tension { background: color-mix(in srgb, var(--tension) 15%, transparent); color: var(--tension); }
.res.dup { color: var(--muted); border: 1px solid var(--line); }
.slot .end { flex-wrap: wrap; justify-content: flex-end; padding-block: 6px; white-space: normal; }
.slot.open .rk { color: var(--ink); }
.slot .nobody { font-style: italic; }
details.more summary { cursor: pointer; font-weight: 600; }
ol.rest { margin: 10px 0 0; padding-left: 2.6em; display: grid; gap: 3px; font-size: 14px; font-variant-numeric: tabular-nums; }
ol.rest li span { font-weight: 600; margin-right: 8px; }
ol.rest li small { font-family: var(--mono); color: var(--muted); font-size: 12px; }
ol.rest li.t span { color: var(--tension); }

/* deck picker */
.deck-block { border-top: 1px solid var(--line); padding-top: 14px; }
.deck-h { font-family: var(--display); font-weight: 800; font-size: 20px; text-transform: uppercase; line-height: 1; }
.pickrow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: start; }
@media (max-width: 520px) { .pickrow { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.pick-label { font-size: 13px; color: var(--muted); padding-top: 7px; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.pick[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.catgroup { display: flex; flex-direction: column; gap: 8px; }
.catgroup + .catgroup { margin-top: 6px; }
.catgroup-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.grp-btns { margin-left: auto; display: flex; gap: 12px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

/* spelling suggestions, timer, perfect answer */
.entry-row .sugg { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 10%, transparent); }
.entry-row .sugg:empty { display: none; }
.entry-row.single { grid-template-columns: minmax(0, 1fr); }
.entry-row.single .sugg { grid-column: 1; }
.seg { flex-wrap: wrap; }
.timer { display: flex; align-items: center; gap: 12px; }
.timer .secs { font-family: var(--display); font-weight: 900; font-size: 36px; line-height: 1; min-width: 2.2ch; color: var(--pc); font-variant-numeric: tabular-nums; }
.timer .bar { flex: 1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }

.switch { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px; }

.field { display: flex; flex-direction: column; gap: 6px; }

const NAME_FILTERS = {

const firstLetter = n => n.normalize("NFD").replace(/[̀-ͯ]/g, "").charAt(0).toUpperCase();
const letterLabel = ls => "starting with " + (ls.length === 1 ? ls : ls.slice(0, -1).split("").join(", ") + " or " + ls.slice(-1));

function scopeRows(scope) {
  const all = Object.entries(COUNTRIES);
  if (scope === "world") return all;
  if (scope.startsWith("cont:")) return all.filter(([, r]) => r.k === scope.slice(5));
  const club = CLUBS[scope.slice(5)];
  return all.filter(([n]) => club.members.includes(n));
}
const scopePhrase = scope => scope === "world" ? "in the world" : scope.startsWith("cont:") ? "in " + CONTINENTS[scope.slice(5)] : CLUBS[scope.slice(5)].phrase;
const scopeNote = scope => scope.startsWith("cont:") ? (CONT_NOTE[scope.slice(5)] || "") : scope.startsWith("club:") ? (CLUBS[scope.slice(5)].note || "") : "";

/* builds a playable list from a twist spec, e.g. {scope:"world", metric:"area", dir:"big", filter:"L:CDE"} */
function makeTwist(spec) {
  const M = MET[spec.metric];
  let rows = scopeRows(spec.scope).filter(([, r]) => { const v = M.get(r); return v != null && isFinite(v); });
  let filterLabel = "";
  if (spec.filter) {
    if (spec.filter.startsWith("L:")) { const ls = spec.filter.slice(2); rows = rows.filter(([n]) => ls.includes(firstLetter(n))); filterLabel = letterLabel(ls); }
    else { const f = NAME_FILTERS[spec.filter]; rows = rows.filter(([n]) => f.test(n)); filterLabel = f.label; }
  }
  rankRows(rows, M, spec.dir);
  const capItems = spec.metric === "cap" || M.alpha === "capital";
  const list = rows.map(([name, r]) => listItem(name, r, M, spec.metric));
  const tension = [];
  for (let rk = 11; rk <= Math.min(14, list.length); rk++) tension.push(rk);
  const whoPart = filterLabel ? (capItems ? `of countries ${filterLabel}` : filterLabel) : "";
  /* e.g. "Largest countries · starting with C, D or E" or "Biggest economies in NATO" */
  const scopeTitle = spec.scope === "world" && filterLabel ? "" : " " + scopePhrase(spec.scope);
  const filterTitle = filterLabel ? " · " + (capItems ? "countries " : "") + filterLabel.replace(/^with /, "") : "";
  const title = `${spec.dir === "big" ? M.big : M.small}${scopeTitle}${filterTitle}`;
  const dirText = spec.dir === "big" ? "largest first" : "smallest first. Number 1 is the smallest, so number 10 is the 10th smallest";
  const club = spec.scope.startsWith("club:") ? CLUBS[spec.scope.slice(5)] : null;
  const facts = {
    region: spec.scope === "world" ? "World" : spec.scope.startsWith("cont:") ? CONTINENTS[spec.scope.slice(5)] : club.label,
    ranked: M.label, order: spec.dir === "big" ? ORDER_BIG : ORDER_SMALL, small: spec.dir === "small",
    filter: filterLabel ? "Names " + filterLabel.replace(/^with names /, "").replace(/^(starting|ending)/, "$1") : "",
    note: joinNotes(club ? (club.note || "").replace(/\.$/, "") : spec.scope.startsWith("cont:") ? CONT_SHORT[spec.scope.slice(5)] : "", METRIC_SHORT[spec.metric],
      filterLabel && !capItems ? "Names as written in English, so Côte d'Ivoire is under C" : "")
  };
  if (M.alpha) {
    const what = M.alpha === "capital" ? "Capitals" : "Countries";
    const where = spec.scope === "world" ? "of the world" : spec.scope.startsWith("cont:") ? "of " + CONTINENTS[spec.scope.slice(5)] : club.phrase;
    return {
      id: spec.sig, twist: true, spec, list, tension, source: M.source,
      title: `${what} ${where}, ${AZ(spec.dir)}`,
      facts: { region: facts.region, ranked: "Alphabetical order", order: AZ_ORDER(spec.dir), small: spec.dir === "small",
        note: joinNotes(club ? (club.note || "").replace(/\.$/, "") : spec.scope.startsWith("cont:") ? CONT_SHORT[spec.scope.slice(5)] : "", AZ_NOTE[M.alpha]) },
      by: `alphabetical · ${AZ(spec.dir)}`,
      prompt: `${what} ${where} in alphabetical order, ${AZ(spec.dir)}. Number 1 comes ${spec.dir === "big" ? "first" : "last"} in the alphabet. ${scopeNote(spec.scope)}`.trim()
    };
  }
  return {
    id: spec.sig, twist: true, spec, title, facts,
    by: `${M.label.startsWith("GDP") ? M.label : M.label.toLowerCase()} · ${spec.dir === "big" ? "largest" : "smallest"} first`,
    prompt: `${capItems ? "Capitals" : "Countries"} ${scopePhrase(spec.scope)}${whoPart ? " " + whoPart : ""}, ranked by ${M.what}, ${dirText}. ${scopeNote(spec.scope)}${filterLabel && !capItems ? " Names are as written in English, so Côte d'Ivoire counts under C." : ""}`.replace(/\s+/g, " ").trim(),
    source: M.source, tension, list
  };
}

const pick = a => a[Math.floor(Math.random() * a.length)];
/* letter sets with enough countries: single letters, or runs of 2–3 letters next to each other in the alphabet */
function letterSets(rows, min) {
  const counts = {};
  rows.forEach(([n]) => { const l = firstLetter(n); counts[l] = (counts[l] || 0) + 1; });
  const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ", sets = [];
  for (let i = 0; i < 26; i++) for (let len = 1; len <= 3 && i + len <= 26; len++) {
    const ls = A.slice(i, i + len), c = ls.split("").reduce((s, l) => s + (counts[l] || 0), 0);
    if (c >= min && c <= Math.max(min * 3, 40) && (len === 1 || ls.split("").every(l => counts[l]))) sets.push(ls);
  }
  return sets;
}
/* a random fresh list from the twist types switched on; avoids signatures in `avoid` */
function randomTwist(types, avoid) {
  const baseMetrics = Object.keys(METRICS), calcMetrics = Object.keys(CALC);
  for (let tries = 0; tries < 80; tries++) {
    const type = pick(types);
    const metric = type === "calc" ? pick(calcMetrics) : pick(types.includes("calc") ? baseMetrics.concat(calcMetrics) : baseMetrics);
    if (MET[metric].alpha && Math.random() < 0.5) continue;
    let scope;
    if (type === "clubs") scope = "club:" + pick(Object.keys(CLUBS));
    else scope = pick(["world", "world", ...Object.keys(CONTINENTS).map(k => "cont:" + k), ...(types.includes("clubs") ? ["club:" + pick(Object.keys(CLUBS))] : [])]);
    const dir = Math.random() < 0.55 ? "big" : "small";
    let filter = "";
    if (!MET[metric].alpha && (type === "letters" || (types.includes("letters") && type === "calc" && Math.random() < 0.25))) {
      const M = MET[metric];
      const rows = scopeRows(scope).filter(([, r]) => { const v = M.get(r); return v != null && isFinite(v); });
      const roll = Math.random();
      if (roll < 0.65) { const sets = letterSets(rows, 14); if (!sets.length) continue; filter = "L:" + pick(sets); }
      else filter = roll < 0.8 ? "ia" : roll < 0.92 ? "short" : "multi";
    }
    const spec = { scope, metric, dir, filter };
    spec.sig = `tw:${scope}:${metric}:${dir}:${filter}`;
    if (avoid.has(spec.sig)) continue;
    const cat = makeTwist(spec);
    if (cat.list.length >= (MET[metric].alpha ? 13 : 12)) return cat;
  }
  return null;
}

/* hard mode: start the list from the middle, either "from number 11/21" or "right after a given entry" */
function hardVariant(cat) {
  const L = cat.list.length, canMid = L >= 24, canAnchor = L >= 20;
  if (!canMid && !canAnchor) return cat;
  const mode = canMid && canAnchor ? (Math.random() < 0.5 ? "mid" : "anchor") : canMid ? "mid" : "anchor";
  let start, title, note;
  if (mode === "mid") {
    start = L >= 34 && Math.random() < 0.4 ? 20 : 10;
    title = `${cat.title}, from number ${start + 1}`;
    var hardFact = `Starts at #${start + 1}: the top ${start} are taken off`;
    note = `Hard mode: the top ${start} are taken off, so number 1 here is really number ${start + 1} on the full list.`;
  } else {
    start = 5 + Math.floor(Math.random() * (L - 14 - 5 + 1));
    const anchor = cat.list[start - 1][0];

  const su = S.setup;
  if (!keepPlayers) {
    S.players = su.names.slice(0, su.count).map((n, i) => ({ name: (n || "").trim() || `Player ${i + 1}`, color: i + 1, total: 0, rounds: [] }));
    saveStore({ count: su.count, names: su.names });
  } else S.players.forEach(p => { p.total = 0; p.rounds = []; });
  const q = buildQueue();
  S.gen = q.gen; S.queue = q.queue; S.queueHard = q.hard;
  S.roundIdx = 0;

}
function startRound() {
  const n = S.players.length;
  let id = S.queue[S.roundIdx];
  markPlayed(id);
  if ((S.queueHard || [])[S.roundIdx] && !catById(id).spec?.scope?.startsWith("club:")) {
    const base = catById(id), h = hardVariant(base);
    if (h !== base) { S.gen = S.gen || {}; S.gen[h.id] = h; id = h.id; }
  }
  S.round = { catId: id, order: Array.from({ length: n }, (_, k) => (S.roundIdx + k) % n), turn: 0, answers: Array(n).fill(null), step: 0 };

}
const curPlayer = () => S.round.order[S.round.turn];
function lockIn(texts) {

  const judged = texts.map(t => t.trim()).filter(Boolean).map(t => judge(t, cat, seen));
  /* no usable answer when time ran out costs the same as a wrong answer */
  r.answers[curPlayer()] = judged.length ? judged : [{ text: "Time ran out", rank: 0, kind: "timeout", pts: -3 }];
  r.turn++;

  else S.phase = "handoff";
}
/* players who named #10, the perfect answer */
function perfectBy() {
  const r = S.round;
  return S.players.map((_, i) => i).filter(i => (r.answers[i] || []).some(a => a.kind === "hit" && a.rank === 10));
}
/* −2 for everyone who missed #10 when someone else found it; applies once #10 is revealed */
function perfectPenalty(i, step) {
  if (step < 10) return 0;
  const by = perfectBy();
  return by.length && !by.includes(i) ? -2 : 0;
}
function roundPoints(i, step) {
  const r = S.round;
  return (r.answers[i] || []).reduce((s, a) => s + (isResolved(a, step) ? a.pts : 0), 0) + perfectPenalty(i, step);
}

}
function revealStep(all) {

  r.step = all ? 11 : Math.min(11, r.step + 1);
  if (r.step >= 11) {
    S.players.forEach((p, i) => { const pts = roundPoints(i, 11); p.rounds.push(pts); p.total += pts; });

}

}

      return `<li><span class="g">${esc(a.text)}${res && a.rank && norm(shown) !== norm(a.text) ? `<small>= ${esc(shown)}</small>` : ""}</span>
        <span class="res ${res ? a.kind : "pending"}">${res ? resultLabel(a) : "?"}</span></li>`;
    }).join("") : `<li><span class="g hint">No answers</span><span class="res pending">0</span></li>`;
    const pen = perfectPenalty(pi, step) ? `<li class="perfect"><span class="g">${esc(pBy.map(x => S.players[x].name).join(" and "))} found the perfect answer</span><span class="res tension">−2</span></li>` : "";
    return `<div class="acard" style="${pc(pi)}"><div class="acard-h"><span>${esc(pl.name)}</span><span class="v">${signed(roundPoints(pi, step))}</span></div><ol>${items}${pen}</ol></div>`;
  }).join("");

  const nextLabel = step < 10 ? `Reveal #${step + 1}` : "Reveal the danger zone";
  const controls = done ? `
    <div class="row end">
      <button class="btn primary big" type="button" data-act="next">${S.roundIdx + 1 >= S.queue.length ? "See final results" : "Next round"}</button>
    </div>` : `
    <div class="row end">
      <button class="btn" type="button" data-act="revealall">Reveal everything</button>
      <button class="btn primary big" type="button" data-act="reveal">${nextLabel}</button>
    </div>`;

  const waitNote = S.mp && !S.mp.isHost ? `<p class="hint">${done ? (S.players.some(p => p.host) ? "The host starts the next round." : "The next round starts from the big screen.") : `${esc((S.players.find(p => p.host) || {}).name || (S.mp && S.mp.room ? "The big screen" : "The host"))} is revealing the list.`}</p>` : "";
  const more = done ? `
    <section class="panel stack" id="tension-panel">
      <div class="tension-list"><span class="label">Danger zone</span>${dangerRanks(cat).map(rk => `<span class="chip t">#${rk} ${esc(cat.list[rk - 1][0])} · −${16 - rk}</span>`).join("")}</div>
      ${cat.removed && cat.removed.length ? `<details class="more" open><summary>Cut off above the start: #1 to #${cat.removed.length} overall</summary>
        <ol class="rest" start="1">${cat.removed.map(a => `<li><span>${esc(a[0])}</span><small>${esc(a[1] || "")}</small></li>`).join("")}</ol></details>` : ""}
      ${cat.list.length > 10 ? `<details class="more"><summary>The rest of the list, #11 to #${cat.list.length}${cat.offset ? ` (#${11 + cat.offset} to #${cat.list.length + cat.offset} overall)` : ""}</summary>
        <ol class="rest" start="11">${cat.list.slice(10).map((a, i) => `<li class="${i + 11 <= 13 ? "t" : ""}"><span>${esc(a[0])}</span><small>${esc(a[1] || "")}${cat.offset ? ` · #${i + 11 + cat.offset} overall` : ""}</small></li>`).join("")}</ol></details>` : ""}
      ${cat.source ? `<p class="source">Source: ${esc(cat.source)}</p>` : ""}
    </section>` : "";

  const status = done ? `Round ${S.roundIdx + 1} done` : step === 0 ? "Everyone has answered" : step <= 10 ? `Revealed #1${step > 1 ? ` to #${step}` : ""}` : "";
  return `
  ${headHTML(cat)}
  <section class="panel stack" id="answers-panel">
    <span class="label">${status}</span>
    <div class="answers">${cards}</div>
  </section>
  <ol class="board" aria-label="Top 10">${slots}</ol>
  <div class="revealbar" role="region" aria-label="Reveal controls">
    <span class="label">${status}</span>
    ${S.mp && !S.mp.isHost ? waitNote : controls}
  </div>
  ${more}`;
}

function standings() { return S.players.map((p, i) => ({ p, i })).sort((a, b) => b.p.total - a.p.total); }

function finalHTML() {
  const st = standings(), top = st[0].p.total;
  const winners = st.filter(x => x.p.total === top), solo = S.players.length === 1;
  const headline = solo ? `${S.players[0].total} points` : winners.length > 1 ? "It's a tie" : `${winners[0].p.name} wins`;
  return `
  <section class="panel stack winner" style="${pc(winners[0].i)}">
    <p class="eyebrow">Game over · ${S.queue.length} rounds</p>
    <div class="crown">${esc(headline)}</div>
    <p class="hint">${solo ? `Over ${S.queue.length} rounds.` : winners.length > 1 ? `${winners.map(w => esc(w.p.name)).join(" and ")} share the top with ${top} points.` : `with ${top} points.`}</p>
    <div class="podium">${st.map((x, k) => `
      <div class="score" style="${pc(x.i)}"><span class="pos">${k + 1}</span><span class="dot"></span>
      <span class="nm">${esc(x.p.name)}</span><span class="tot">${x.p.total}</span></div>`).join("")}</div>
    <div class="row end">
      ${S.mp ? (S.mp.isHost ? `<button class="btn" type="button" data-act="quit">Close the room</button>
      <button class="btn primary big" type="button" data-act="again">New game in this room</button>` : `<button class="btn" type="button" data-act="quit">Leave the room</button><span class="hint">The host can start a new game in this room.</span>`)
      : `<button class="btn" type="button" data-act="newgame">Change players or lists</button>
      <button class="btn primary big" type="button" data-act="again">Play again</button>`}
    </div>
  </section>`;
}


/* the whole scoring scale: safe zone, scoring zone, danger zone, everything else */
function scaleHTML() {
  const top = Array.from({ length: 10 }, (_, i) => `<div class="step"><i style="--h: var(--h${i + 1})">${i + 1}</i><em class="${i < 3 ? "neg" : "pos"}">${worth(i + 1)}${i === 9 ? "<b>★</b>" : ""}</em></div>`).join("");
  const danger = [11, 12, 13].map(r => `<div class="step"><i class="dz dz${r}">${r}</i><em class="neg">−${16 - r}</em></div>`).join("");
  return `<div class="scale">
    <div class="zones"><span style="flex: 3">Safe zone</span><span style="flex: 7">Scoring zone</span></div>
    <div class="ladder scored">${top}</div>
    <div class="zones"><span style="flex: 3">Danger zone</span><span style="flex: 7">Everything else</span></div>
    <div class="ladder scored">${danger}<div class="step rest"><i>14+ · not on the list · no answer</i><em class="neg">−3</em></div></div>
  </div>`;
}
/* "Canada · #5" — the player's answer this round and where it landed */
function answerSummary(i) {
  const r = S.round, cat = catById(r.catId), a = ((r.answers || [])[i] || [])[0];
  if (!a || a.kind === "timeout") return "No answer";
  const name = a.member || (a.rank && cat && cat.list[a.rank - 1] ? cat.list[a.rank - 1][0] : a.above && cat && cat.removed ? cat.removed[a.above - 1][0] : a.text);
  const pos = a.kind === "above" ? `#${a.above} overall, above the start` : a.kind === "dup" ? "repeat" : a.rank ? `#${a.rank}${a.kind === "tension" ? ", danger zone" : ""}` : "not on the list";
  return `${name} · ${pos}`;
}
function renderSide() {
  const el = document.getElementById("side");
  if (S.mp && (S.phase === "mp-lobby" || S.phase === "mp-question")) { el.innerHTML = mpSideHTML(); return; }
  if (S.phase === "setup") {
    el.innerHTML = `
    <section class="panel stack">
      <h2>How to score</h2>
      <ul class="rules">
        <li><span class="k hit">+N</span><span>Name number 4 to 10 and you score its place. Number 8 is worth 8 points.</span></li>
        <li><span class="k hit">★</span><span>Number 10 is the perfect answer. Name it and every other player loses 2.</span></li>
        <li><span class="k m">−3…−1</span><span>Safe zone: number 1 costs 3, number 2 costs 2 and number 3 costs 1.</span></li>
        <li><span class="k t">−5…−3</span><span>Danger zone, just outside the top 10: number 11 costs 5, number 12 costs 4 and number 13 costs 3.</span></li>
        <li><span class="k m">−3</span><span>Everything else: number 14 and below, anything not on the list, or no answer. You'll still see where it ranks.</span></li>
      </ul>
      <div><span class="label">The scale</span>${scaleHTML()}</div>
      <p class="hint">Each player writes one answer in secret, passing the screen around. No two players can pick the same answer, so going later in the round is harder. When everyone is done, the list is revealed from number 1 down to number 10, then the danger zone. Misspelled answers get a "did you mean" before you lock in.</p>
    </section>`;
    return;
  }
  const r = S.round, ph = S.phase;
  const live = ph === "reveal";
  const st = S.players.map((p, i) => ({ p, i, t: p.total + (live ? roundPoints(i, r.step) : 0) })).sort((a, b) => b.t - a.t);
  const scores = st.map((x, k) => {
    let sub = "";
    if (ph === "handoff" || ph === "entry") {
      const idx = r.order.indexOf(x.i);
      sub = r.answers[x.i] ? "answers locked in" : idx === r.turn ? (ph === "entry" ? "answering now" : "up next") : "waiting";
    } else if (live) sub = `this round ${signed(roundPoints(x.i, r.step))}`;
    else if (ph === "roundEnd" && x.p.rounds.length) sub = `${esc(answerSummary(x.i))}<br><b class="${x.p.rounds[x.p.rounds.length - 1] < 0 ? "neg" : "pos"}">${signed(x.p.rounds[x.p.rounds.length - 1])} this round</b>`;
    else if (x.p.rounds.length) sub = `last round ${signed(x.p.rounds[x.p.rounds.length - 1])}`;
    const now = (ph === "handoff" || ph === "entry") && curPlayer() === x.i;
    return `<li class="score ${now ? "now" : ""}" style="${pc(x.i)}">
      <span class="pos">${k + 1}</span><span class="dot"></span>
      <span class="nm">${esc(x.p.name)}${sub ? `<small>${sub}</small>` : ""}</span>
      <span class="tot">${x.t}</span></li>`;
  }).join("");
  const played = S.players[0].rounds.length;
  const hist = played ? `
    <div class="hist-wrap"><table class="hist">
      <thead><tr><th>Round</th>${S.players.map((p, i) => `<th style="${pc(i)}; color: var(--pc)">${esc(p.name.slice(0, 6))}</th>`).join("")}</tr></thead>
      <tbody>${Array.from({ length: played }, (_, k) => `<tr><td>${k + 1}. ${esc(catById(S.queue[k])?.title || "")}</td>${S.players.map(p => `<td>${signed(p.rounds[k])}</td>`).join("")}</tr>`).join("")}</tbody>
      <tfoot><tr><td>Total</td>${S.players.map(p => `<td>${p.total}</td>`).join("")}</tr></tfoot>
    </table></div>` : `<p class="hint">Round results appear here after each round.</p>`;
  el.innerHTML = `
  <section class="panel stack">
    <div class="row" style="justify-content: space-between; align-items: baseline">
      <h2>Scoreboard</h2><span class="eyebrow">${ph === "final" ? "Final" : `Round ${S.roundIdx + 1}/${S.queue.length}`}</span>
    </div>
    <ol class="scores">${scores}</ol>
    ${hist}
  </section>
  ${ph !== "final" ? `<div><button class="btn small" type="button" data-act="quit">${S.mp ? (S.mp.isHost ? "Close the room" : "Leave the room") : "End game and return to setup"}</button></div>` : ""}`;
}

function parseLines(text) {
  return text.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const tension = l.startsWith("*");
    const parts = l.replace(/^\*\s*/, "").split("/").map(x => x.trim()).filter(Boolean);
    let val = "", aliases = parts.slice(1);
    if (aliases.length && /\d/.test(aliases[0])) { val = aliases[0]; aliases = aliases.slice(1); }
    return { entry: [parts[0], val, aliases], tension };
  });
}


/* ---------- phone mode ----------
   Everyone plays on their own phone. Needs config.js with a Supabase project (see setup guide);
   without it the option stays hidden. The host's phone runs the game: it writes the room state,
   everyone else follows it. The database enforces the rules: one answer per player per round,
   each answer claimed only once, and nobody can read other answers before the reveal. */
const MP_MAX = 6;
const MP_LETTERS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
let SB = null, MP_CH = null, MP_POLL = null, mpChain = Promise.resolve();
const M = { me: null, closedAbs: null };

function mpAvailable() {
  const c = window.GEO_CONFIG;
  return !!(window.supabase && c && /^https:\/\//.test(c.url || "") && c.key && !/PASTE/i.test(c.key + c.url));
}
/* run phone-mode work one step at a time, so updates never overlap */
function mpQueue(fn) {
  mpChain = mpChain.then(fn).catch(err => { if (S.ui) S.ui.mpErr = (err && err.message) || String(err); mpRender(); });
  return mpChain;
}
function mpAction(fn) {
  S.ui.mpBusy = true; S.ui.mpErr = ""; render();
  return mpQueue(async () => { try { await fn(); } finally { S.ui.mpBusy = false; mpRender(); } });
}
/* re-render without losing the text box focus or cursor */
function mpRender() {
  const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
  render();
  if (id) { const el = document.getElementById(id); if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
}

async function mpClient() {
  if (!mpAvailable()) throw new Error("Phone mode isn't set up on this site yet.");
  if (!SB) SB = window.supabase.createClient(GEO_CONFIG.url, GEO_CONFIG.key, { auth: { persistSession: true, autoRefreshToken: true } });
  let { data: { session } } = await SB.auth.getSession();
  if (!session) {
    const { data, error } = await SB.auth.signInAnonymously();
    if (error) throw new Error("Couldn't sign in as a guest. In Supabase, check that anonymous sign-ins are switched on. (" + error.message + ")");
    session = data.session;
  }
  M.me = session.user.id;
  return SB;
}

async function mpCreate(name, asScreen) {
  const sb = await mpClient();
  for (let tries = 0; tries < 8; tries++) {
    const code = Array.from({ length: 4 }, () => MP_LETTERS[Math.floor(Math.random() * MP_LETTERS.length)]).join("");
    const { error } = await sb.from("rooms").insert({ code, state: { phase: "lobby", base: 0, round: 0, rounds: 0, abs: -1 } });
    if (!error) return mpJoinRoom(code, name, asScreen);
    if (error.code !== "23505") throw new Error("Couldn't create the room: " + error.message);
  }
  throw new Error("Couldn't find a free room code. Try again.");
}

/* asScreen: this device runs the game for a big screen but isn't a player itself */
async function mpJoinRoom(code, name, asScreen) {
  const sb = await mpClient();
  code = (code || "").toUpperCase().replace(/[^A-Z]/g, "");
  if (code.length !== 4) throw new Error("Room codes have four letters.");
  const { data: room, error } = await sb.from("rooms").select("*").eq("code", code).maybeSingle();
  if (error) throw new Error(error.message);
  if (!room) throw new Error(`There's no game with the code ${code}. Check the code with the host.`);
  if (asScreen && room.host !== M.me) throw new Error("Only the device that created the room can be its big screen.");
  const { data: mine } = await sb.from("players").select("*").eq("room_code", code).eq("uid", M.me).maybeSingle();
  if (asScreen) {}
  else if (!mine) {
    const { error: e2 } = await sb.from("players").insert({ room_code: code, name: name || "Player" });
    if (e2 && e2.code !== "23505") throw new Error("Couldn't join: " + e2.message);
    const { data: all } = await sb.from("players").select("uid, joined_at").eq("room_code", code).order("joined_at");
    if (all && all.length > MP_MAX && all.slice(MP_MAX).some(p => p.uid === M.me)) {
      await sb.from("players").delete().eq("room_code", code).eq("uid", M.me);
      throw new Error(`That room is full (${MP_MAX} players).`);
    }
  } else if (name && mine.name !== name) {
    await sb.from("players").update({ name }).eq("room_code", code).eq("uid", M.me);
  }
  S.mp = { code, isHost: room.host === M.me, isScreen: !!asScreen, room: null, players: [], answers: {}, done: {}, progress: [],
    draft: [""], kept: [""], entryErr: "", submitted: "", timedOut: false, sending: false, lastAbs: null, focus: false };
  saveStore(asScreen ? { mp: { code, screen: true } } : { mp: { code }, mpName: name || (mine && mine.name) || "" });
  await mpRefreshNow();
  mpSubscribe();
}

async function mpResume(code, asScreen) {
  const sb = await mpClient();
  if (asScreen) {
    const { data: room } = await sb.from("rooms").select("host").eq("code", code).maybeSingle();
    if (!room || room.host !== M.me) { saveStore({ mp: null }); return; }
    return mpJoinRoom(code, "", true);
  }
  const { data: me } = await sb.from("players").select("*").eq("room_code", code).eq("uid", M.me).maybeSingle();
  if (!me) { saveStore({ mp: null }); return; }
  await mpJoinRoom(code, me.name);
}

function mpSubscribe() {
  const code = S.mp.code;
  if (MP_CH) SB.removeChannel(MP_CH);
  const refresh = () => mpQueue(mpRefreshNow);
  MP_CH = SB.channel("room-" + code)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "rooms", filter: "code=eq." + code }, p => mpQueue(() => mpApplyRoom(p.new, null)))
    .on("postgres_changes", { event: "*", schema: "public", table: "players", filter: "room_code=eq." + code }, refresh)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "progress", filter: "room_code=eq." + code }, refresh)
    .subscribe();
  clearInterval(MP_POLL);
  /* backup in case the live connection drops */
  MP_POLL = setInterval(() => { if (S.mp && !document.hidden) refresh(); }, 5000);
}

async function mpRefreshNow() {
  if (!S.mp || !SB) return;
  const code = S.mp.code;
  const [r1, r2] = await Promise.all([
    SB.from("rooms").select("*").eq("code", code).maybeSingle(),
    SB.from("players").select("*").eq("room_code", code)
  ]);
  if (!r1.error && !r1.data) return mpGone("The host closed the room.");
  if (r1.error) throw new Error(r1.error.message);
  if (r2.data && !S.mp.isScreen && !r2.data.some(p => p.uid === M.me)) return mpGone("You're no longer in that room.");
  await mpApplyRoom(r1.data, r2.data);
}

async function mpApplyRoom(room, players) {
  const mp = S.mp;
  if (!mp || !room) return;
  const prev = (mp.room && mp.room.state) || {};
  mp.room = room;
  if (players) mp.players = players;
  mp.isHost = room.host === M.me;
  const st = room.state || {}, base = st.base || 0, k = st.round || 0, abs = base + k;
  if ((st.phase === "reveal" || st.phase === "roundEnd") && prev.abs === st.abs && (st.step || 0) > (prev.step || 0)) {
    S.ui.scrollTo = st.step >= 11 ? "tension-panel" : "slot-" + st.step;
  }
  if (st.phase === "question" && mp.lastAbs !== abs) {
    mp.lastAbs = abs; mp.draft = [""]; mp.kept = [""]; mp.entryErr = ""; mp.submitted = ""; mp.timedOut = false; mp.progress = []; mp.focus = true;
  }
  if (st.phase === "question") {
    const { data } = await SB.from("progress").select("uid").eq("room_code", mp.code).eq("round", abs);
    mp.progress = (data || []).map(r => r.uid);
    if (!mp.submitted && mp.progress.includes(M.me)) {
      const { data: mine } = await SB.from("answers").select("*").eq("room_code", mp.code).eq("round", abs).eq("uid", M.me);
      if (mine && mine.length) mp.submitted = mine[0].text;
    }
  }
  /* everyone's answers, once the host has started the reveal for that round */
  if (st.phase !== "lobby") {
    const need = [];
    for (let j = 0; j <= k; j++) { const a = base + j; if (a <= room.revealed_round && !mp.done[a]) need.push(a); }
    if (need.length) {
      const { data, error } = await SB.from("answers").select("*").eq("room_code", mp.code).in("round", need);
      if (!error) need.forEach(a => { mp.answers[a] = (data || []).filter(r => r.round === a); mp.done[a] = true; });
    }
  }
  mpSync();
  mpRender();
  if (mp.isHost) mpHostTick();
}

function mpGone(msg) {
  clearInterval(MP_POLL);
  if (MP_CH && SB) SB.removeChannel(MP_CH);
  MP_CH = null; S.mp = null;
  saveStore({ mp: null });
  S.phase = "setup"; S.ui.mode = "phones"; S.ui.mpErr = msg || "";
  render();
}

/* translate the shared room into the same shape the one-screen game uses, so the reveal and scoreboard are shared */
function mpAnswerArrays(abs, roster, ps, open) {
  const rows = S.mp.answers[abs] || [];
  return ps.map(p => {
    const row = rows.find(r => r.uid === p.uid);
    if (row) return [Object.assign({}, row.result, { text: row.text })];
    if (open) return null;
    return roster.includes(p.uid) ? [{ text: "No answer", rank: 0, kind: "timeout", pts: -3 }] : [];
  });
}
function mpRoundPoints(arr) {
  const hitters = arr.map((a, i) => (a || []).some(x => x.kind === "hit" && x.rank === 10) ? i : -1).filter(i => i >= 0);
  return arr.map((a, i) => (a || []).reduce((s, x) => s + x.pts, 0) + (hitters.length && !hitters.includes(i) ? -2 : 0));
}
function mpSync() {
  const mp = S.mp, st = mp.room.state || {};
  const ps = mp.players.slice().sort((a, b) => (a.joined_at < b.joined_at ? -1 : 1));
  S.players = ps.map((p, i) => ({ name: p.name, uid: p.uid, color: (i % MP_MAX) + 1, total: 0, rounds: [], host: p.uid === mp.room.host, me: p.uid === M.me }));
  const n = st.rounds || 0, k = st.round || 0, base = st.base || 0;
  S.queue = Array.from({ length: n }, (_, j) => "mp-" + (base + j));
  S.gen = S.gen || {};
  (st.titles || []).forEach((t, j) => { const key = "mp-" + (base + j); if (t && !(S.gen[key] && S.gen[key].list)) S.gen[key] = { title: t }; });
  if (st.cat) S.gen["mp-" + (base + k)] = st.cat;
  S.roundIdx = k;
  const finished = st.phase === "roundEnd" || st.phase === "final" ? k + 1 : st.phase === "lobby" ? 0 : k;
  for (let j = 0; j < finished && j < n; j++) {
    const pts = mpRoundPoints(mpAnswerArrays(base + j, (st.rosters || [])[j] || [], ps, false));
    S.players.forEach((p, i) => { p.rounds.push(pts[i]); p.total += pts[i]; });
  }
  S.phase = { lobby: "mp-lobby", question: "mp-question", reveal: "reveal", roundEnd: "roundEnd", final: "final" }[st.phase] || "mp-lobby";
  S.round = {
    catId: "mp-" + (base + k), order: ps.map((_, i) => i), turn: 0, step: st.step || 0,
    answers: st.phase === "lobby" ? [] : mpAnswerArrays(base + k, (st.rosters || [])[k] || [], ps, st.phase === "question"),
    draft: mp.draft, kept: mp.kept, entryErr: mp.entryErr, deadline: st.deadline || 0
  };
}

/* ---- host actions ---- */
async function mpWrite(state, extra) {
  const { data, error } = await SB.from("rooms").update(Object.assign({ state }, extra || {})).eq("code", S.mp.code).select().maybeSingle();
  if (error) throw new Error("Couldn't update the game: " + error.message);
  if (data) await mpApplyRoom(data, null);
}
async function mpStartGame() {
  if (S.mp.isScreen && !S.mp.players.length) throw new Error("Nobody has joined yet. Scan the QR code or enter the room code on a phone to join.");
  const q = buildQueue();
  if (!q.queue.length) throw new Error("There are no lists to play. Turn on random twists or pick lists in Advanced settings.");
  const items = q.queue.map((id, i) => Object.assign(q.gen[id] ? { spec: q.gen[id].spec, title: q.gen[id].title } : { id }, { hard: !!q.hard[i] }));
  const st = S.mp.room.state || {};
  const next = Object.assign({}, st, {
    base: st.phase === "lobby" && st.rounds ? (st.base || 0) + st.rounds : (st.base || 0),
    round: 0, rounds: items.length, queue: items, titles: [], rosters: [], step: 0,
    settings: { timer: S.setup.timer, level: S.setup.level }
  });
  await mpStartRound(next, 0);
}
async function mpStartRound(st, k) {
  const item = st.queue[k];
  let cat = item.spec ? makeTwist(item.spec) : catById(item.id);
  if (!cat) throw new Error("That list isn't on this device any more.");
  markPlayed(item.spec ? item.spec.sig : item.id);
  if (item.hard && !(item.spec && item.spec.scope.startsWith("club:"))) cat = hardVariant(cat);
  const slim = { id: cat.id, title: cat.title, by: cat.by, prompt: cat.prompt, source: cat.source || "", tension: cat.tension, list: cat.list, twist: !!cat.twist, hard: cat.hard || "",
    removed: cat.removed || null, offset: cat.offset || 0, facts: factsFor(cat) };
  const titles = (st.titles || []).slice(), rosters = (st.rosters || []).slice();
  titles[k] = cat.title;
  rosters[k] = S.mp.players.map(p => p.uid);
  const timer = (st.settings && st.settings.timer) || 0;
  await mpWrite(Object.assign({}, st, {
    phase: "question", round: k, abs: (st.base || 0) + k, step: 0, cat: slim, titles, rosters,
    deadline: timer ? Date.now() + timer * 1000 : 0
  }));
}
function mpHostTick() {
  const mp = S.mp;
  if (!mp || !mp.isHost || !mp.room) return;
  const st = mp.room.state || {};
  if (st.phase !== "question" || M.closedAbs === st.abs) return;
  const roster = (st.rosters || [])[st.round] || [];
  const everyone = roster.length > 0 && roster.every(u => mp.progress.includes(u) || !mp.players.some(p => p.uid === u));
  const late = st.deadline && Date.now() > st.deadline + 1500;
  if (everyone || late) mpQueue(mpCloseRound);
}
async function mpCloseRound() {
  const st = S.mp.room.state;
  if (st.phase !== "question" || M.closedAbs === st.abs) return;
  M.closedAbs = st.abs;
  await mpWrite(Object.assign({}, st, { phase: "reveal", step: 0 }), { revealed_round: st.abs });
}
async function mpRevealStep(all) {
  const st = S.mp.room.state;
  const step = all ? 11 : Math.min(11, (st.step || 0) + 1);
  await mpWrite(Object.assign({}, st, { step, phase: step >= 11 ? "roundEnd" : "reveal" }));
}
async function mpNext() {
  const st = S.mp.room.state;
  if (st.round + 1 < st.rounds) await mpStartRound(st, st.round + 1);
  else await mpWrite(Object.assign({}, st, { phase: "final" }));
}
async function mpBackToLobby() {
  const st = S.mp.room.state;
  await mpWrite(Object.assign({}, st, { phase: "lobby", step: 0, cat: null, deadline: 0 }));
}
async function mpLeave() {
  const mp = S.mp;
  if (!mp) { S.phase = "setup"; render(); return; }
  if (mp.isHost) await SB.from("rooms").delete().eq("code", mp.code);
  else await SB.from("players").delete().eq("room_code", mp.code).eq("uid", M.me);
  mpGone("");
}

async function mpSubmit() {
  const mp = S.mp, st = mp.room.state;
  const inp = document.getElementById("ans-0");
  if (inp) mp.draft[0] = inp.value;
  const text = (mp.draft[0] || "").trim();
  if (mp.submitted || mp.sending) return;
  if (!text) { mp.entryErr = "Write an answer before you lock in."; return mpSyncRender(); }
  if (pendingSugg(0)) { mp.entryErr = "Check the spelling suggestion first: use it, or keep your own spelling."; return mpSyncRender(); }
  const cat = catById(S.round.catId);
  const res = judge(text, cat, new Set());
  const claim = claimKey(text, res);
  mp.entryErr = ""; mp.sending = true; mpSyncRender();
  const { error } = await SB.from("answers").insert({ room_code: mp.code, round: st.abs, text, claim_key: claim, result: res });
  mp.sending = false;
  if (!error) mp.submitted = text;
  else if (error.code === "23505" && /claim/i.test(error.message)) mp.entryErr = `Too bad, someone already took "${text}". Pick another answer.`;
  else if (error.code === "23505") mp.submitted = text;
  else if (error.code === "42501") mp.entryErr = "This round has already closed, so your answer didn't count.";
  else mp.entryErr = "Your answer didn't go through: " + error.message;
  mpSyncRender();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, su = S.setup;
  if (S.mp && ["reveal", "revealall", "next", "again", "newgame", "quit"].includes(act)) {
    if (act === "quit" || act === "newgame") { mpAction(mpLeave); return; }
    if (!S.mp.isHost) return;
    mpAction(act === "reveal" ? () => mpRevealStep(false) : act === "revealall" ? () => mpRevealStep(true) : act === "next" ? mpNext : mpBackToLobby);
    return;
  }
  if (act === "mode") { S.ui.mode = b.dataset.m; S.ui.mpErr = ""; saveStore({ mode: S.ui.mode }); render(); return; }
  if (act === "mpcreate" || act === "mpjoin") {
    const f = S.ui.mpForm || {};
    const name = ((act === "mpcreate" ? f.hostName : f.joinName) || "").trim();
    if (!name) { S.ui.mpErr = "Write your name first."; render(); return; }
    mpAction(() => act === "mpcreate" ? mpCreate(name) : mpJoinRoom(f.code || "", name));
    return;
  }
  if (act === "mpscreen") { mpAction(() => mpCreate("", true)); return; }
  if (act === "mpstart") { if (S.mp && S.mp.isHost) mpAction(mpStartGame); return; }
  if (act === "mpclose") { if (S.mp && S.mp.isHost) mpAction(mpCloseRound); return; }
  if (act === "mpleave") { mpAction(mpLeave); return; }
  if (act === "mpcopy") {
    const inp = document.getElementById("mp-link");
    navigator.clipboard.writeText(inp.value).then(() => { b.textContent = "Copied"; }, () => { inp.select(); });
    return;
  }
  if (act === "count") su.count = +b.dataset.n;
  else if (act === "rounds") su.rounds = Math.min(twistTypes().length ? 30 : Math.max(1, poolIds().length), Math.max(1, su.rounds + +b.dataset.d));
  else if (act === "grp") {
    const ids = classicCats().filter(c => (c.custom ? "custom" : c.group) === b.dataset.g).map(c => c.id);
    su.selected = su.selected.filter(id => !ids.includes(id));
    if (b.dataset.on === "1") su.selected = su.selected.concat(ids);
  }
  else if (act === "tog") {
    const g = b.dataset.group, v = b.dataset.v;
    su[g] = su[g].includes(v) ? su[g].filter(x => x !== v) : su[g].concat(v);
  }
  else if (act === "guesses") su.guesses = Math.min(6, Math.max(1, su.guesses + +b.dataset.d));
  else if (act === "opencustom") { S.ui.customOpen = true; S.ui.customErr = ""; }
  else if (act === "closecustom") S.ui.customOpen = false;
  else if (act === "delcat") {
    e.preventDefault();
    S.custom = S.custom.filter(c => c.id !== b.dataset.id);
    su.selected = su.selected.filter(id => id !== b.dataset.id);
    saveStore({ custom: S.custom });
  }
  else if (act === "start") { if (!poolIds().length && !twistTypes().length) return; startGame(false); }
  else if (act === "level") { su.level = b.dataset.l; saveStore({ level: su.level }); }
  else if (act === "adv") { S.ui.advanced = !S.ui.advanced; }
  else if (act === "resethist") saveStore({ played: {} });
  else if (act === "timer") { su.timer = +b.dataset.t; saveStore({ timer: su.timer }); }
  else if (act === "begin") beginEntry();
  else if (act === "usesugg" || act === "keepsugg") {
    const k = +b.dataset.k, r = S.round;
    if (act === "usesugg") { r.draft[k] = b.dataset.v; const inp = document.getElementById("ans-" + k); if (inp) inp.value = b.dataset.v; }
    else r.kept[k] = norm(r.draft[k] || "");
    const box = document.getElementById("sug-" + k); if (box) box.innerHTML = "";
    const next = document.getElementById("ans-" + (k + 1)); (next || document.getElementById("ans-" + k))?.focus();
    return;
  }
  else if (act === "reveal") { revealStep(false); S.ui.scrollTo = S.round.step >= 11 ? "tension-panel" : "slot-" + S.round.step; }
  else if (act === "revealall") { revealStep(true); S.ui.scrollTo = "tension-panel"; }
  else if (act === "next") nextRound();
  else if (act === "again") startGame(true);
  else if (act === "newgame" || act === "quit") S.phase = "setup";
  render();
});

  if (exact <= 0) {
    const r = S.round;
    Array.from({ length: S.setup.guesses }, (_, k) => { const inp = document.getElementById("ans-" + k); if (inp) r.draft[k] = inp.value; });
    const text = (r.draft[0] || "").trim();
    lockIn(text && !isTaken(text) ? [text] : []);
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}, 200);

/* true when another player already locked in the same answer this round (same list entry or same text) */
function isTaken(text) {
  const r = S.round, cat = catById(r.catId), key = claimKey(text, matchAny(text, cat));
  return r.answers.some(a => (a || []).some(x => x.kind !== "timeout" && claimKey(x.text, x) === key));
}

/* ---------- boot ---------- */
function start(data) {
  S = data && data.phase && data.setup && (!data.round || data.round.order) && (data.phase !== "entry" || data.round.draft) ? data : init();
  if (S.setup.timer === undefined) S.setup.timer = 0;
  S.setup.guesses = 1;
  for (const g of ["conts", "measures", "dirs"]) if (!Array.isArray(S.setup[g])) S.setup[g] = DEFAULT_DECK[g].slice();
  if (!Array.isArray(S.setup.twists)) S.setup.twists = ["letters", "clubs", "calc"];
  if (!S.setup.level) S.setup.level = S.setup.hard ? "hard" : S.setup.twistsOn === false ? "easy" : "medium";
  if (!S.gen) S.gen = {};
  /* lists added in an update start switched on */
  if (!Array.isArray(S.setup.knownMeasures)) S.setup.knownMeasures = ["area", "pop", "gdp", "gdppc", "tour", "cap"];
  for (const m of Object.keys(METRICS)) if (!S.setup.knownMeasures.includes(m)) { S.setup.knownMeasures.push(m); if (!S.setup.measures.includes(m)) S.setup.measures.push(m); }
  if (!Array.isArray(S.setup.known)) S.setup.known = S.setup.selected.slice();
  for (const c of classicCats()) if (!S.setup.known.includes(c.id)) { S.setup.known.push(c.id); if (!S.setup.selected.includes(c.id)) S.setup.selected.push(c.id); }
  /* phone mode: a link with ?room=ABCD opens the join form; an unfinished game is rejoined */
  const st = loadStore();
  S.ui.mode = S.ui.mode || st.mode || "local";
  S.ui.mpForm = S.ui.mpForm || { hostName: st.mpName || "", joinName: st.mpName || "", code: "" };
  S.ui.mpBusy = false;
  if (S.mp) { S.mp = null; S.phase = "setup"; }
  if (mpAvailable()) {
    const room = new URLSearchParams(location.search).get("room");
    if (room) { S.ui.mode = "phones"; S.ui.mpForm.code = room.toUpperCase().slice(0, 4); }
    if (st.mp && st.mp.code) mpAction(() => mpResume(st.mp.code, !!st.mp.screen));
  }
  render();
}
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
